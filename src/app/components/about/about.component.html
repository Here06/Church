<section id="about" class="about" aria-labelledby="about-title">
  <app-section-heading class="mobile-heading" title="About us" />

  <div class="story">
    <img class="photo" [src]="image()" alt="The New Covenant Church of Christ emblem" loading="lazy">
    <div class="copy">
      <h2 id="about-title" class="desktop-heading">About us</h2>
      <p>
        The New Covenant Church of Christ is a Christ-centred community, proclaiming the new covenant and sharing God’s love with the world.<span class="extra"> We exist to worship God, build people, and make a lasting impact in our communities and beyond.</span>
      </p>
      <a appButton routerLink="/" fragment="about">Learn More&nbsp;&nbsp;›</a>
    </div>
  </div>
</section>
